# Opsional: PostgreSQL lokal via Docker -> `docker compose up -d`
services:
  db:
    image: postgres:16
    container_name: arsipindex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arsipindex
    ports:
      - "5432:5432"
    volumes:
      - arsipindex-data:/var/lib/postgresql/data
volumes:
  arsipindex-data:
